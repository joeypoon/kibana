openapi: 3.0.0
info:
  title: Response Actions Schema
  version: 'not applicable'
paths: {}
components:
  x-codegen-enabled: true
  schemas:
    ResponseActionTypes:
      type: string
      enum:
        - .osquery
        - .endpoint

    ResponseActionComment:
      type: string
      description: Optional comment explaining the response action.
      maxLength: 10000

    OsqueryQueryText:
      type: string
      description: Osquery SQL query text.
      maxLength: 10000

    OsqueryQueryId:
      type: string
      description: Query ID.
      maxLength: 128

    OsqueryVersionOrPlatform:
      type: string
      maxLength: 64

    OsquerySavedObjectId:
      type: string
      description: Saved object identifier (pack or saved query).
      maxLength: 256

    EcsMappingValueString:
      type: string
      maxLength: 1024

    EcsMappingValue:
      oneOf:
        - $ref: '#/components/schemas/EcsMappingValueString'
        - type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EcsMappingValueString'

    EcsMappingItem:
      type: object
      properties:
        field:
          type: string
          maxLength: 256
        value:
          $ref: '#/components/schemas/EcsMappingValue'

    EcsMapping:
      type: object
      description: 'Map Osquery results columns or static values to Elastic Common Schema (ECS) fields. Example: "ecs_mapping": {"process.pid": {"field": "pid"}}'
      maxProperties: 1000
      additionalProperties:
        $ref: '#/components/schemas/EcsMappingItem'

    OsqueryQuery:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OsqueryQueryId'
        query:
          $ref: '#/components/schemas/OsqueryQueryText'
        ecs_mapping:
          $ref: '#/components/schemas/EcsMapping'
        version:
          $ref: '#/components/schemas/OsqueryVersionOrPlatform'
        platform:
          $ref: '#/components/schemas/OsqueryVersionOrPlatform'
        removed:
          type: boolean
        snapshot:
          type: boolean
      required:
        - id
        - query

    OsqueryParams:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/OsqueryQueryText'
          description: 'To run a single query, use the query field and enter a SQL query. Example: "query": "SELECT * FROM processes;"'
        ecs_mapping:
          $ref: '#/components/schemas/EcsMapping'
        queries:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/OsqueryQuery'
        pack_id:
          $ref: '#/components/schemas/OsquerySavedObjectId'
          description: 'To specify a query pack, use the packId field. Example: "packId": "processes_elastic"'
        saved_query_id:
          $ref: '#/components/schemas/OsquerySavedObjectId'
          description: 'To run a saved query, use the saved_query_id field and specify the saved query ID. Example: "saved_query_id": "processes_elastic"'
        timeout:
          type: number
          description: 'A timeout period, in seconds, after which the query will stop running. Overwriting the default timeout allows you to support queries that require more time to complete. The default and minimum supported value is 60. The maximum supported value is 900. Example: "timeout": 120.'

    OsqueryParamsCamelCase:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/OsqueryQueryText'
        ecsMapping:
          $ref: '#/components/schemas/EcsMapping'
        queries:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/OsqueryQuery'
        packId:
          $ref: '#/components/schemas/OsquerySavedObjectId'
        savedQueryId:
          $ref: '#/components/schemas/OsquerySavedObjectId'
        timeout:
          type: number

    OsqueryResponseAction:
      type: object
      properties:
        action_type_id:
          type: string
          enum:
            - .osquery
        params:
          $ref: '#/components/schemas/OsqueryParams'
      required:
        - action_type_id
        - params

    # Camel cased versions of OsqueryResponseAction
    RuleResponseOsqueryAction:
      type: object
      properties:
        actionTypeId:
          type: string
          enum:
            - .osquery
        params:
          $ref: '#/components/schemas/OsqueryParamsCamelCase'
      required:
        - actionTypeId
        - params

    DefaultParams:
      type: object
      properties:
        command:
          type: string
          enum:
            - isolate
        comment:
          $ref: '#/components/schemas/ResponseActionComment'
      required:
        - command

    RunScriptOsConfigValues:
      type: object
      minProperties: 1
      properties:
        scriptId:
          type: string
          description: The ID of the script to run (from the Kibana Script library)
          maxLength: 128
        scriptInput:
          type: string
          description: The arguments to pass to the script (if any)
          maxLength: 4096
        timeout:
          type: integer
          description: Specify the timeout in seconds for the script execution
          example: 60

    RunscriptParams:
      type: object
      description: Run a script on the Elastic Defend host that triggered the alert.
      required:
        - command
      properties:
        command:
          type: string
          enum:
            - runscript
        comment:
          $ref: '#/components/schemas/ResponseActionComment'
          description: Add a note that explains or describes the action. You can find your comment in the response actions history log
        config:
          type: object
          properties:
            linux:
              $ref: '#/components/schemas/RunScriptOsConfigValues'
            macos:
              $ref: '#/components/schemas/RunScriptOsConfigValues'
            windows:
              $ref: '#/components/schemas/RunScriptOsConfigValues'

    EndpointProcessConfigField:
      type: string
      description: Field to use instead of process.pid
      maxLength: 256

    ProcessesParams:
      type: object
      properties:
        command:
          type: string
          enum:
            - kill-process
            - suspend-process
          description: 'To run an endpoint response action, specify a value for the command field. Example: "command": "isolate"'
        comment:
          $ref: '#/components/schemas/ResponseActionComment'
          description: 'Add a note that explains or describes the action. You can find your comment in the response actions history log. Example: "comment": "Check processes"'
        config:
          required:
            - field
          type: object
          properties:
            field:
              $ref: '#/components/schemas/EndpointProcessConfigField'
            overwrite:
              type: boolean
              description: Whether to overwrite field with process.pid
              default: true
      required:
        - command
        - config

    EndpointResponseAction:
      type: object
      properties:
        action_type_id:
          type: string
          enum:
            - .endpoint
        params:
          oneOf:
            - $ref: '#/components/schemas/DefaultParams'
            - $ref: '#/components/schemas/ProcessesParams'
            - $ref: '#/components/schemas/RunscriptParams'
      required:
        - action_type_id
        - params

    # Camel cased versions of EndpointResponseAction
    RuleResponseEndpointAction:
      type: object
      properties:
        actionTypeId:
          type: string
          enum:
            - .endpoint
        params:
          oneOf:
            - $ref: '#/components/schemas/DefaultParams'
            - $ref: '#/components/schemas/ProcessesParams'
            - $ref: '#/components/schemas/RunscriptParams'
      required:
        - actionTypeId
        - params

    ResponseAction:
      discriminator:
        propertyName: action_type_id
        mapping:
          .osquery: '#/components/schemas/OsqueryResponseAction'
          .endpoint: '#/components/schemas/EndpointResponseAction'
      oneOf:
        - $ref: '#/components/schemas/OsqueryResponseAction'
        - $ref: '#/components/schemas/EndpointResponseAction'


    # Camel Cased versions of ResponseAction
    RuleResponseAction:
      discriminator:
        propertyName: actionTypeId
        mapping:
          .osquery: '#/components/schemas/RuleResponseOsqueryAction'
          .endpoint: '#/components/schemas/RuleResponseEndpointAction'
      oneOf:
        - $ref: '#/components/schemas/RuleResponseOsqueryAction'
        - $ref: '#/components/schemas/RuleResponseEndpointAction'
