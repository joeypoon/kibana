openapi: 3.0.0
info:
  title: Get Suggestions Schema
  version: '2023-10-31'
paths:
  /internal/api/endpoint/suggestions/{suggestion_type}:
    post:
      summary: Get suggestions
      operationId: GetEndpointSuggestions
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - field
                - query
              properties:
                field:
                  type: string
                  maxLength: 256
                  description: ECS field path for autocomplete suggestions.
                query:
                  type: string
                  maxLength: 1024
                  description: Autocomplete prefix query string.
                filters:
                  type: array
                  maxItems: 50
                  description: Elasticsearch filter clauses. Runtime validation in get_suggestions.ts enforces key count, array item count, and string lengths; the generated schema only bounds top-level array size.
                  items:
                    type: object
                    additionalProperties: true
                fieldMeta:
                  type: object
                  description: Field metadata map. Runtime validation in get_suggestions.ts enforces a maximum of 50 keys and per-key string lengths; the generated schema only bounds value types.
                  additionalProperties:
                    oneOf:
                      - type: string
                        maxLength: 10000
                      - type: number
                      - type: boolean
      parameters:
        - name: suggestion_type
          in: path
          required: true
          schema:
            type: string
            enum:
              - eventFilters
              - endpoints
              - endpointExceptions
              - trustedApps
              - trustedDevices

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../model/schema/common.schema.yaml#/components/schemas/SuccessResponse'
